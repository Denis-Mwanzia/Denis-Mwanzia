name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Snake Animation (Rainbow Trail)
        uses: Platane/snk@v3
        with:
          github_user_name: Denis-Mwanzia
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          color_snake: "#FF0000" # Red head of snake
          color_dots: "#FF0000,#FF7F00,#FFFF00,#00FF00,#0000FF,#4B0082,#8F00FF"
          color_empty: "#00000000" # Transparent grid background
          pixel_size: 10
          speed: 1
          frame: 1
          mask: false
          gif: false

      - name: Push Generated Files
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
